
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLIM Documentary Engine 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#090b10;color:#fff;font-family:Arial,sans-serif}
main{max-width:900px;margin:auto}
h1{font-size:26px;letter-spacing:2px}
.gold{color:#c49a58}
.muted{color:#9299a8}
.panel{background:#151923;border:1px solid #303744;border-radius:12px;padding:17px;margin:18px 0}
label{display:block;margin:15px 0 7px}
input,select,textarea{width:100%;padding:13px;background:#090e17;border:1px solid #384151;border-radius:8px;color:white;font-size:15px}
textarea{min-height:75px}
button{width:100%;padding:14px;margin-top:13px;background:#c49a58;color:#111;border:0;border-radius:8px;font-weight:bold}
.secondary{background:#303947;color:white}
.scene{padding:15px;margin:14px 0;background:#0b111c;border-left:3px solid #c49a58;border-radius:7px}
.scene h3{color:#c49a58}
.scene p{line-height:1.55}
#output{line-height:1.6;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>OLIM <span class="gold">DOCUMENTARY</span></h1>
<p class="muted">ENGINE 3.0 — SCENE DIRECTOR</p>

<section class="panel">
<h3>PROJECT SETTINGS</h3>

<label>Тема фильма</label>
<input id="topic" placeholder="Например: История UFC">

<label>Главный герой</label>
<input id="hero" placeholder="Например: Путь бойца">

<label>Продолжительность</label>
<select id="duration">
<option value="1">1 минута</option>
<option value="5">5 минут</option>
<option value="10">10 минут</option>
<option value="30">30 минут</option>
</select>

<label>Стиль</label>
<select id="style">
<option>Кинематографический</option>
<option>Исторический</option>
<option>Спортивный документальный</option>
<option>Расследование</option>
<option>Биографический</option>
<option>Мрачный документальный</option>
</select>

<label>Дополнительная информация</label>
<textarea id="details" placeholder="Важные события, даты, факты..."></textarea>

<button onclick="createFilm()">СОЗДАТЬ ДОКУМЕНТАЛЬНЫЙ ФИЛЬМ</button>
</section>

<section class="panel">
<h3>SCENE DIRECTOR OUTPUT</h3>
<div id="output">Здесь появится структура фильма.</div>
<button class="secondary" onclick="copyFilm()">КОПИРОВАТЬ ПРОЕКТ</button>
<button class="secondary" onclick="downloadFilm()">СКАЧАТЬ ПРОЕКТ TXT</button>
</section>

<p class="muted">OLIM ENGINE 3.0 · LOCAL GENERATOR · FACT CHECK REQUIRED</p>
</main>

<script>
let projectText="";

function createFilm(){
const topic=document.getElementById("topic").value.trim();
const hero=document.getElementById("hero").value.trim()||"Не указан";
const duration=Number(document.getElementById("duration").value);
const style=document.getElementById("style").value;
const details=document.getElementById("details").value.trim();

if(!topic){alert("Введите тему фильма");return;}

const parts=[
["ВСТУПЛЕНИЕ","Открывающий кадр, который сразу заинтересует зрителя.","Обозначить главную загадку или вопрос истории.","Крупный план, архивный кадр или общий атмосферный план.","Короткий звуковой акцент, затем спокойная музыка.","Плавное затемнение."],
["ПРЕДЫСТОРИЯ","Показать место, время и обстоятельства событий.","Объяснить, как началась история и почему она важна.","Архивные фотографии, карта, документы, временная шкала.","Спокойная документальная музыка.","Плавный переход."],
["ЗНАКОМСТВО С ГЕРОЕМ","Представить главного героя и его окружение.","Раскрыть характер, цели и обстоятельства жизни героя.","Портрет, фотографии, интервью, детали окружения.","Нейтральная атмосферная музыка.","Смена планов."],
["РАЗВИТИЕ СОБЫТИЙ","Показать последовательность основных событий.","Рассказать о ключевых решениях и последствиях.","Хроника, фотографии, карты, подтверждённые материалы.","Музыка постепенно усиливается.","Монтаж по смыслу."],
["ПОВОРОТНЫЙ МОМЕНТ","Выделить событие, изменившее ход истории.","Объяснить, почему этот момент стал решающим.","Архивный материал, крупные планы деталей, графика.","Пауза и музыкальный акцент.","Резкий переход по смыслу."],
["КУЛЬМИНАЦИЯ","Представить наиболее важное событие истории.","Раскрыть его значение и последствия.","Самые значимые доступные документальные кадры.","Напряжённая музыка.","Замедление темпа."],
["ПОСЛЕДСТВИЯ","Показать, что произошло после главных событий.","Объяснить влияние истории на настоящее.","Современные кадры, сравнение прошлого и настоящего.","Музыка становится спокойнее.","Плавный переход."],
["ФИНАЛ","Оставить зрителю важную мысль.","Подвести итог и вернуться к главному вопросу фильма.","Символический заключительный кадр.","Спокойное завершение музыки.","Затемнение."]
];

const count=duration===1?4:duration===5?6:duration===10?8:8;
const selected=parts.slice(0,count);
const sceneTime=duration/selected.length;

let html=`<h2>${escapeHTML(topic)}</h2>
<p>Герой: ${escapeHTML(hero)}<br>Стиль: ${escapeHTML(style)}<br>Продолжительность: ${duration} мин.</p>
<p><b>ПРОИЗВОДСТВЕННЫЙ ПЛАН</b></p>`;

projectText=`OLIM DOCUMENTARY ENGINE 3.0\nТЕМА: ${topic}\nГЕРОЙ: ${hero}\nСТИЛЬ: ${style}\nДЛИТЕЛЬНОСТЬ: ${duration} минут\n\n`;

selected.forEach((part,i)=>{
const time=sceneTime.toFixed(2);
html+=`<div class="scene">
<h3>СЦЕНА ${i+1} — ${part[0]}</h3>
<p><b>Время:</b> ${time} мин.</p>
<p><b>Содержание:</b> ${part[1]}</p>
<p><b>Диктор:</b> ${part[2]}</p>
<p><b>Видеоряд:</b> ${part[3]}</p>
<p><b>Звук:</b> ${part[4]}</p>
<p><b>Монтаж:</b> ${part[5]}</p>
</div>`;

projectText+=`\nСЦЕНА ${i+1}: ${part[0]}\nВремя: ${time} мин.\nСодержание: ${part[1]}\nДиктор: ${part[2]}\nВидеоряд: ${part[3]}\nЗвук: ${part[4]}\nМонтаж: ${part[5]}\n`;
});

projectText+=`\nДОПОЛНИТЕЛЬНЫЕ ДЕТАЛИ:\n${details||"Не указаны"}\n\nПРОВЕРКА: все даты, имена, цитаты и события должны быть проверены по надёжным источникам.\n`;
document.getElementById("output").innerHTML=html;
}

function escapeHTML(value){
return value.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function copyFilm(){
if(!projectText){alert("Сначала создай проект");return;}
const area=document.createElement("textarea");
area.value=projectText;
document.body.appendChild(area);
area.select();
try{document.execCommand("copy");alert("Проект скопирован");}
catch(e){alert("Не удалось скопировать");}
area.remove();
}

function downloadFilm(){
if(!projectText){alert("Сначала создай проект");return;}
const blob=new Blob(["\uFEFF"+projectText],{type:"text/plain;charset=utf-8"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;a.download="OLIM-Documentary-Project.txt";a.click();
URL.revokeObjectURL(url);
}
</script>
</body>
</html>
